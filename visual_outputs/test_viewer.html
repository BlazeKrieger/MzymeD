<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>3D Viewer Test</title>
</head>
<body>
  <h1>Testing 3Dmol Viewer</h1>
  <div id="viewer" style="width: 800px; height: 600px; position: relative; border: 1px solid black;"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.3/build/3Dmol-min.js"></script>
  <script>
    let viewer = $3Dmol.createViewer(document.getElementById('viewer'),{backgroundColor:'white'});
    
    // Simple example PDB data
    let pdbData = `ATOM      1  CA  GLY A   1       0.000   0.000   0.000  1.00  0.00           C
ATOM      2  CA  GLY A   2       5.000   0.000   0.000  1.00  0.00           C
ATOM      3  CA  GLY A   3      10.000   0.000   0.000  1.00  0.00           C
ATOM      4  CA  GLY B   1      -5.000   5.000   0.000  1.00  0.00           C
ATOM      5  CA  GLY B   2      -5.000   0.000   0.000  1.00  0.00           C
END`;
    
    viewer.addModel(pdbData, "pdb");
    viewer.setStyle({}, {sphere:{scale: 0.8}});
    viewer.setStyle({chain:"A"}, {sphere:{color:"red"}});
    viewer.setStyle({chain:"B"}, {sphere:{color:"blue"}});
    viewer.zoomTo();
    viewer.zoom(1.2);
    viewer.render();
    
    console.log("Viewer initialized successfully");
  </script>
</body>
</html>
